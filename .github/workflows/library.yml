name: Library upkeep

on:
  push:
    branches: [main]
    paths: ["library/**", "about.html"]
  schedule:
    - cron: "0 20 * * 0"   # Mondays, early morning in Melbourne
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  rebuild:
    name: Rebuild library pages
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 library/build.py
      - name: Commit rebuilt pages if anything changed
        run: |
          git config user.name "Library bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild library pages" && git push)

  links:
    name: Weekly link check
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: check
        run: python3 library/tools/check_links.py --report report.md
        continue-on-error: true
      - name: Open an issue when links have died
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Library links need attention ($(date '+%d %b %Y'))" --body-file report.md
